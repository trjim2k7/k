version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: fastapi_db
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_password
    ports:
      - "5432:5432" # Expose PostgreSQL to the host machine for direct access (e.g., via psql client)
    volumes:
      - pg_data:/var/lib/postgresql/data # Persist PostgreSQL data

  web:
    build: . # Build the image from the Dockerfile in the current directory
    restart: always
    ports:
      - "8000:8000" # Expose FastAPI application to the host machine
    depends_on:
      - db # Ensure the database service starts before the web service
    environment:
      # PostgreSQL connection details
      DB_HOST: db # Service name of the PostgreSQL container within the Docker network
      DB_PORT: 5432
      DB_NAME: fastapi_db
      DB_USER: fastapi_user
      DB_PASSWORD: fastapi_password
      # Derived DATABASE_URL (optional, but good practice if the app expects it)
      DATABASE_URL: postgresql://fastapi_user:fastapi_password@db:5432/fastapi_db

      # FastAPI/Authentication settings
      SECRET_KEY: "your-super-secret-key-for-local-dev-change-in-prod" # IMPORTANT: Change this for production!
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # Database connection pool settings (for SQLAlchemy)
      DATABASE_ECHO: "true" # Set to 'true' to log all SQL statements (useful for local development)
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
      # --reload enables auto-reloading for local development

volumes:
  pg_data: # Named volume for PostgreSQL data persistence